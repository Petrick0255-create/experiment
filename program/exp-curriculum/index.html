<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#16233d">
  <title>커리큘럼 설계 | LAB NOTE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../../index.html">
      <span class="brand-mark">L</span>
      <span><strong>LAB NOTE</strong><small>CURRICULUM BUILDER</small></span>
    </a>
    <div class="top-actions">
      <span class="save-state" id="saveState">실험 목록 불러오는 중</span>
      <button class="button secondary" id="reloadArchiveButton">아카이브 새로고침</button>
      <button class="button secondary" id="importButton">배치 불러오기</button>
      <input id="importInput" type="file" accept=".json,application/json" hidden>
      <button class="button secondary" id="exportButton">배치 내려받기</button>
      <button class="button danger" id="resetButton">현재 연도 초기화</button>
    </div>
  </header>

  <main class="app-shell">
    <aside class="library-panel">
      <div class="library-head">
        <a href="../../index.html">← 메인으로</a>
        <p class="eyebrow">EXPERIMENT DECK</p>
        <h1>실험 카드</h1>
        <p>카드를 끌어 원하는 주차에 놓으세요.</p>
      </div>

      <div class="filters">
        <label class="search">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="실험명·코드·단원 검색">
        </label>
        <div class="filter-row">
          <select id="fieldFilter" aria-label="분야">
            <option value="">전체 분야</option>
            <option>물리</option><option>화학</option><option>생명</option>
            <option>지구과학</option><option>수학</option><option>공학</option><option>예술</option>
          </select>
          <select id="difficultyFilter" aria-label="난이도">
            <option value="">전체 난이도</option>
            <option>매우 쉬움</option><option>쉬움</option><option>보통</option>
            <option>어려움</option><option>매우 어려움</option>
          </select>
        </div>
        <div class="library-count">
          <span>검색 결과 <b id="resultCount">0</b>개</span>
          <span>배치 완료 <b id="assignedCount">0</b>개</span>
        </div>
      </div>

      <div class="selected-guide" id="selectedGuide" hidden>
        <span>선택한 카드</span>
        <strong id="selectedName"></strong>
        <button id="cancelSelection" type="button">선택 취소</button>
      </div>

      <div class="experiment-library" id="experimentLibrary"></div>
      <div class="empty-library" id="emptyLibrary" hidden>조건에 맞는 실험이 없습니다.</div>
    </aside>

    <div class="panel-resizer" id="panelResizer" role="separator" aria-label="실험 카드 패널 너비 조절" aria-orientation="vertical" tabindex="0">
      <span></span>
    </div>

    <section class="curriculum-panel">
      <div class="curriculum-head">
        <div>
          <p class="eyebrow">ANNUAL CURRICULUM</p>
          <h2><span id="headingGrade">7세</span> 연간 커리큘럼</h2>
        </div>
        <div class="plan-controls">
          <label>연도<input id="yearInput" type="number" min="2020" max="2100" value="2026"></label>
          <label>주당 실험<select id="slotCountSelect"><option value="2">2개</option><option value="1">1개</option></select></label>
          <div class="annual-stat"><span>연간 배치</span><strong id="annualCount">0</strong><small id="annualCapacity">/ 96</small></div>
        </div>
      </div>

      <nav class="grade-tabs" id="gradeTabs" aria-label="학년 선택"></nav>
      <div class="period-controls">
        <nav class="view-tabs" id="viewTabs" aria-label="보기 범위">
          <button type="button" data-view="month" class="active">월별</button>
          <button type="button" data-view="quarter">3개월</button>
          <button type="button" data-view="year">1년</button>
        </nav>
        <nav class="month-tabs" id="monthTabs" aria-label="월 또는 분기 선택"></nav>
      </div>

      <div class="board-heading">
        <div>
          <span id="boardYear">2026년</span>
          <h3><b id="boardPeriod">1월</b> 프로그램</h3>
        </div>
        <p>같은 연도 안에서 동일한 실험은 한 번만 배치할 수 있습니다.</p>
      </div>

      <div class="week-board" id="weekBoard"></div>
    </section>
  </main>

  <template id="libraryCardTemplate">
    <article class="experiment-card library-card" draggable="true">
      <div class="card-body">
        <div class="card-topline">
          <span class="card-code"></span>
          <span class="card-grade"></span>
        </div>
        <strong class="card-title"></strong>
        <div class="card-tags">
          <span class="card-field"></span>
          <span class="card-difficulty"></span>
        </div>
        <div class="card-curriculum">
          <small>교과 연계</small>
          <span></span>
        </div>
      </div>
      <button class="select-card" type="button">배치 선택</button>
      <span class="used-badge">배치됨</span>
    </article>
  </template>

  <template id="placedCardTemplate">
    <article class="experiment-card placed-card" draggable="true">
      <div class="card-body">
        <div class="card-topline">
          <span class="card-code"></span>
          <span class="card-grade"></span>
        </div>
        <strong class="card-title"></strong>
        <div class="card-tags">
          <span class="card-field"></span>
          <span class="card-difficulty"></span>
        </div>
        <div class="card-curriculum">
          <small>교과 연계</small>
          <span></span>
        </div>
      </div>
      <button class="remove-card" type="button" aria-label="배치에서 제거">×</button>
    </article>
  </template>

  <div class="hover-preview" id="hoverPreview" hidden>
    <img id="hoverPreviewImage" alt="">
    <span id="hoverPreviewEmpty">실험지 이미지 없음</span>
  </div>

  <dialog class="image-modal" id="imageModal">
    <div class="modal-head">
      <div><span id="modalCode"></span><strong id="modalTitle"></strong></div>
      <button id="closeImageModal" type="button" aria-label="닫기">×</button>
    </div>
    <div class="modal-image-stage" id="modalImageStage"></div>
    <div class="modal-image-tabs" id="modalImageTabs"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
